<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1725: Dynamic Synaptic Routing 3D</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            touch-action: none;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }
        #ui {
            position: fixed;
            top: 10px; left: 10px; right: 10px;
            z-index: 10;
            pointer-events: none;
        }
        #ui > * { pointer-events: auto; }
        .panel {
            background: rgba(0, 10, 20, 0.85);
            border: 1px solid #00f3ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
        }
        h1 {
            margin: 0 0 5px 0;
            color: #00f3ff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        select, button {
            background: #0a1a2e;
            color: white;
            border: 1px solid #00f3ff;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
        }
        button {
            background: #00f3ff;
            color: #000;
            font-weight: bold;
            min-width: 100%;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:active { background: #00ff9d; }
        #mode-indicator {
            color: #00ff9d;
            font-weight: bold;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
        #stats {
            position: fixed;
            bottom: 10px; left: 10px; right: 10px;
            z-index: 10;
            font-size: 11px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 2px;
        }
        .efficient { color: #00ff9d; font-weight: bold; }
        .inefficient { color: #ff2a6d; font-weight: bold; }
        #phase {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00f3ff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 15px #00f3ff;
            z-index: 20;
            pointer-events: none;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #00f3ff;
            width: 80%;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui">
        <div class="panel">
            <h1>F1725 // Synaptic Routing 3D</h1>
            <div style="font-size:10px;color:#888;margin-bottom:8px;text-align:center;">1 dedo: Rotar | 2 dedos: Zoom/Mover</div>
            <div class="controls">
                <select id="taskType">
                    <option value="secure_code">Código Seguro</option>
                    <option value="creative">Redacción Creativa</option>
                    <option value="data_analysis">Análisis de Datos</option>
                </select>
                <select id="networkMode">
                    <option value="emergent">Sinapsis Emergentes</option>
                    <option value="traditional">Red Densa Tradicional</option>
                </select>
                <button onclick="startGeneration()">▶ EJECUTAR PROMPT</button>
            </div>
            <div id="mode-indicator">MODO: SINAPSIS EMERGENTES</div>
        </div>
    </div>

    <div id="stats" class="panel">
        <div class="stat-row"><span>Parámetros Activos:</span> <span id="statParams">0%</span></div>
        <div class="stat-row"><span>Consumo (TFLOPs):</span> <span id="statFlops">0</span></div>
        <div class="stat-row"><span>Latencia:</span> <span id="statLatency">0 ms</span></div>
        <div class="stat-row"><span>Skills Activos:</span> <span id="statSkills">0/6</span></div>
        <div class="stat-row"><span>KSHIELD:</span> <span id="statKshield" class="efficient">ACTIVO</span></div>
    </div>

    <div id="phase">FASE: LISTO</div>

    <!-- Carga clásica y 100% compatible de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;

        // Luces
        scene.add(new THREE.AmbientLight(0x404040, 1.5));
        const light1 = new THREE.PointLight(0x00f3ff, 2, 100);
        light1.position.set(10, 10, 10);
        scene.add(light1);
        const light2 = new THREE.PointLight(0xff00ff, 1, 100);
        light2.position.set(-10, -10, -10);
        scene.add(light2);

        // Grid y Estrellas
        const grid = new THREE.GridHelper(60, 30, 0x00f3ff, 0x001133);
        grid.position.y = -8;
        scene.add(grid);

        const starsGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(300 * 3);
        for (let i = 0; i < 300; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 100;
            starPos[i*3+1] = (Math.random() - 0.5) * 100;
            starPos[i*3+2] = (Math.random() - 0.5) * 100;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.2 }));
        scene.add(stars);

        const skills = [
            { id: 'logic', name: 'Lógica', color: 0x00f3ff },
            { id: 'creative', name: 'Creativo', color: 0xff9d00 },
            { id: 'kshield', name: 'KSHIELD', color: 0x00ff9d },
            { id: 'data', name: 'Datos', color: 0xbd00ff },
            { id: 'vision', name: 'Visión', color: 0xff2a6d },
            { id: 'audio', name: 'Audio', color: 0x00bfff }
        ];

        let nodes = [];
        let connections = [];
        let nodeLabels = [];

        function createTextSprite(text, colorHex) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
            ctx.font = 'bold 24px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(text, 128, 40);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(4, 1, 1);
            return sprite;
        }

        function createNode(x, y, z, type, label, color = 0x333333) {
            const size = type === 'reasoning' || type === 'bottleneck' ? 1.2 : 0.8;
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshPhongMaterial({
                color: 0x111111,
                emissive: color,
                emissiveIntensity: 0.3,
                shininess: 100
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.userData = { type, label, color, baseColor: color, active: false };
            scene.add(mesh);
            nodes.push(mesh);

            const labelSprite = createTextSprite(label, color);
            labelSprite.position.set(x, y + 1.5, z);
            labelSprite.userData = { target: mesh };
            scene.add(labelSprite);
            nodeLabels.push(labelSprite);

            return mesh;
        }

        function createConnection(source, target, color = 0x333333) {
            const geo = new THREE.BufferGeometry().setFromPoints([source.position, target.position]);
            const mat = new THREE.LineBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.3 });
            const line = new THREE.Line(geo, mat);
            line.userData = { source, target, baseColor: color, active: false };
            scene.add(line);
            connections.push(line);
            return line;
        }

        function clearNetwork() {
            nodes.forEach(n => scene.remove(n));
            nodeLabels.forEach(l => scene.remove(l));
            connections.forEach(c => scene.remove(c));
            nodes = []; nodeLabels = []; connections = [];
        }

        function buildNetwork() {
            clearNetwork();
            const mode = document.getElementById('networkMode').value;
            const isEmergent = mode === 'emergent';

            const input = createNode(-12, 0, 0, 'input', 'PROMPT', 0xffffff);
            input.userData.active = true;
            input.material.emissiveIntensity = 1;

            const skillNodes = [];
            skills.forEach((skill, i) => {
                const angle = (i / skills.length) * Math.PI * 2;
                const x = -5 + Math.cos(angle) * 0.5;
                const y = Math.sin(angle) * 5;
                const z = Math.cos(angle * 2) * 3;
                const node = createNode(x, y, z, 'skill', skill.name, skill.color);
                skillNodes.push(node);
                createConnection(input, node, skill.color);
            });

            if (isEmergent) {
                const r1 = createNode(5, 3, 0, 'reasoning', 'RAZON-A', 0x00ff9d);
                const r2 = createNode(5, -3, 0, 'reasoning', 'RAZON-B', 0x00ff9d);
                skillNodes.forEach((n, i) => {
                    createConnection(n, i < 3 ? r1 : r2, 0x00ff9d);
                });
                const out = createNode(12, 0, 0, 'output', 'SALIDA', 0xffffff);
                createConnection(r1, out, 0xffffff);
                createConnection(r2, out, 0xffffff);
            } else {
                const bn = createNode(5, 0, 0, 'bottleneck', 'CUELLO BOTELLA', 0xff2a6d);
                skillNodes.forEach(n => createConnection(n, bn, 0xff2a6d));
                const out = createNode(12, 0, 0, 'output', 'SALIDA', 0xffffff);
                createConnection(bn, out, 0xff2a6d);
            }
        }

        function setPhase(text) {
            const el = document.getElementById('phase');
            el.innerText = `FASE: ${text}`;
            el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 1800);
        }

        function updateStats(mode, task) {
            const p = document.getElementById('statParams');
            const f = document.getElementById('statFlops');
            const l = document.getElementById('statLatency');
            const s = document.getElementById('statSkills');
            const k = document.getElementById('statKshield');
            if (mode === 'emergent') {
                const n = task === 'secure_code' ? 3 : 2;
                p.innerText = `${Math.round(n/6*100)}%`; p.className = 'efficient';
                f.innerText = `${Math.round(n/6*100)}T`; f.className = 'efficient';
                l.innerText = '120 ms'; l.className = 'efficient';
                s.innerText = `${n}/6`;
                k.innerText = task === 'secure_code' ? 'VALIDANDO' : 'N/A';
                k.className = task === 'secure_code' ? 'efficient' : '';
            } else {
                p.innerText = '100%'; p.className = 'inefficient';
                f.innerText = '850T'; f.className = 'inefficient';
                l.innerText = '850 ms'; l.className = 'inefficient';
                s.innerText = '6/6 (RUIDO)';
                k.innerText = 'COLAPSADO'; k.className = 'inefficient';
            }
        }

        function activateNode(node, color) {
            node.userData.active = true;
            node.material.emissive.setHex(color);
            node.material.emissiveIntensity = 1.5;
        }

        function activateConn(conn, color) {
            conn.userData.active = true;
            conn.material.color.setHex(color);
            conn.material.opacity = 1;
        }

        window.startGeneration = function() {
            const mode = document.getElementById('networkMode').value;
            const task = document.getElementById('taskType').value;
            const isE = mode === 'emergent';

            nodes.forEach(n => {
                n.userData.active = false;
                n.material.emissive.setHex(n.userData.baseColor);
                n.material.emissiveIntensity = (n.userData.type === 'input' || n.userData.type === 'output') ? 1 : 0.2;
            });
            connections.forEach(c => {
                c.userData.active = false;
                c.material.color.setHex(0x222222);
                c.material.opacity = 0.3;
            });

            document.getElementById('mode-indicator').innerText = isE ? 'MODO: SINAPSIS EMERGENTES (F1725)' : 'MODO: RED DENSA TRADICIONAL';
            document.getElementById('mode-indicator').style.color = isE ? '#00ff9d' : '#ff2a6d';

            updateStats(mode, task);

            setTimeout(() => {
                setPhase('1. LECTURA DE PROMPT');
                setTimeout(() => {
                    setPhase(isE ? '2. SKILLS ESPECÍFICOS' : '2. ACTIVACIÓN MASIVA');
                    let toAct = [];
                    if (isE) {
                        if (task === 'secure_code') toAct = ['logic','kshield','data'];
                        else if (task === 'creative') toAct = ['creative','logic'];
                        else toAct = ['data','logic'];
                    } else {
                        toAct = skills.map(s => s.id);
                    }
                    
                    nodes.forEach(n => {
                        if (n.userData.type === 'skill') {
                            const skillObj = skills.find(s => n.userData.label.includes(s.name));
                            if (skillObj && toAct.includes(skillObj.id)) {
                                activateNode(n, skillObj.color);
                                connections.forEach(c => {
                                    if (c.userData.source.userData.type === 'input' && c.userData.target === n) {
                                        activateConn(c, skillObj.color);
                                    }
                                });
                            } else if (!isE) {
                                activateNode(n, 0xff2a6d);
                                connections.forEach(c => {
                                    if (c.userData.source.userData.type === 'input' && c.userData.target === n) {
                                        activateConn(c, 0xff2a6d);
                                    }
                                });
                            }
                        }
                    });

                    setTimeout(() => {
                        setPhase(isE ? '3. RAZONAMIENTO + KSHIELD' : '3. CUELLO DE BOTELLA');
                        nodes.forEach(n => {
                            if (n.userData.type === 'reasoning' || n.userData.type === 'bottleneck') {
                                const col = isE ? 0x00ff9d : 0xff2a6d;
                                activateNode(n, col);
                                connections.forEach(c => {
                                    if (c.userData.target === n && c.userData.source.userData.active) {
                                        activateConn(c, col);
                                    }
                                });
                            }
                        });
                        setTimeout(() => {
                            setPhase('4. SALIDA GENERADA');
                            nodes.forEach(n => {
                                if (n.userData.type === 'output') {
                                    activateNode(n, 0xffffff);
                                    connections.forEach(c => {
                                        if (c.userData.target === n && c.userData.source.userData.active) {
                                            activateConn(c, 0xffffff);
                                        }
                                    });
                                }
                            });
                        }, 1500);
                    }, 1500);
                }, 1000);
            }, 500);
        };

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const t = Date.now() * 0.001;
            nodes.forEach(n => {
                if (n.userData.active) {
                    const s = 1 + Math.sin(t * 4) * 0.15;
                    n.scale.set(s, s, s);
                }
            });
            nodeLabels.forEach(l => {
                if (l.userData.target) {
                    l.position.copy(l.userData.target.position);
                    l.position.y += 1.5;
                }
            });
            stars.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('networkMode').addEventListener('change', buildNetwork);

        buildNetwork();
        animate();
    </script>
</body>
</html>
